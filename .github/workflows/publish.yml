name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Check out kolang interpreter repo (for keywords.json)
        uses: actions/checkout@v4
        with:
          repository: faralidev/kolang
          path: ./kolang
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Generate keywords.json from kolang token package
        working-directory: ./kolang
        run: go generate ./internal/token/
      - name: Generate grammar (if generator exists)
        env:
          KOLANG_KEYWORDS_JSON: ${{ github.workspace }}/kolang/keywords.json
        run: |
          if [ -f scripts/generate.js ]; then
            KOLANG_KEYWORDS_JSON="$KOLANG_KEYWORDS_JSON" npm run generate
          else
            echo "No scripts/generate.js found — skipping generate"
          fi
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}