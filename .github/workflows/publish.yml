name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Used by prepublishOnly → npm run generate → scripts/generate.js to find
      # keywords.json (generated by `go generate` into the kolang repo root).
      KOLANG_KEYWORDS_JSON: ${{ github.workspace }}/kolang/keywords.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Check out kolang interpreter repo (for keywords.json)
        uses: actions/checkout@v5
        with:
          repository: faralidev/kolang
          path: ./kolang
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - name: Generate keywords.json from kolang token package
        working-directory: ./kolang
        run: go generate ./internal/token/
      - name: Generate grammar (if generator exists)
        run: |
          if [ -f scripts/generate.js ]; then
            npm run generate
          else
            echo "No scripts/generate.js found — skipping generate"
          fi
      - name: Publish
        run: npm publish --provenance --access public